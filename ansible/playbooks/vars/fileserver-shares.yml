# =========================================================================================== #
# File: 'ansible/playbooks/vars/fileserver-shares.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# One compact declaration shared by the fleet and manual directory playbooks. The roles add the
# protected principals and fixed access-rule fields before any value crosses a module boundary.
#
# =========================================================================================== #
---
fileserver_shares:
  access_groups:
    path: 'OU=Domain Groups,DC=tcn,DC=trinitytechnicalservices,DC=com'
    unmanaged_principals: ['TCN\Domain Users']
    groups:
      # yamllint disable rule:commas
      - { principal: 'TCN\TCN_GS-FileShare_Sites-Modify',
          description: 'Membership grants modify access to the sites share.' }
      - { principal: 'TCN\TCN_GS-FileShare_Sites-North-Modify',
          description: 'Membership grants modify access to the North folder of the sites share.' }
      - { principal: 'TCN\TCN_GS-FileShare_Sites-North-Projects-Modify',
          description: 'Membership grants modify access to the North Projects folder of the sites share.' }
      - { principal: 'TCN\TCN_GS-FileShare_Sites-North-Projects-Read',
          description: 'Membership grants read access to the North Projects folder of the sites share.' }
      # yamllint enable rule:commas
  shares:
    - name: 'data'
      path: 'D:\shares\data'
      description: 'Highly available file data'
      access:
        - { principal: 'TCN\Domain Users', rights: 'Modify', share: 'Change' }
    - name: 'sites'
      path: 'D:\shares\sites'
      description: 'Highly available site file data'
      access:
        - { principal: 'TCN\TCN_GS-FileShare_Sites-Modify', rights: 'Modify', share: 'Change' }
      folders:
        - path: 'North'
          inherit: false
          access:
            - { principal: 'TCN\TCN_GS-FileShare_Sites-North-Modify', rights: 'Modify' }
        - path: 'North\Projects'
          access:
            - { principal: 'TCN\TCN_GS-FileShare_Sites-North-Projects-Modify', rights: 'Modify' }
            - { principal: 'TCN\TCN_GS-FileShare_Sites-North-Projects-Read', rights: 'ReadAndExecute' }
