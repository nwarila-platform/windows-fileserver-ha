# =========================================================================================== #
# File: 'ansible/playbooks/fileserver-aws.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Brings five ephemeral EC2 instances through host preparation, forms the declared four-node
# cluster under its service account, adopts both shared disks, publishes the implemented AZ-a
# clustered data share, and configures its dedicated third-AZ file-share witness.
#
# Runs from the COMPOSED tree only: the workflow overlays this repository onto the pinned
# ansible-framework and runs this against a dynamic EC2 inventory filtered to one run.
#
# The order is load-bearing: identity resolution, host bootstrap, and node prerequisites precede
# singleton cluster formation, fresh readback, and credential cleanup. The AZ-b file-server role
# and Storage Replica remain deferred.
#
# gather_facts and become are disabled throughout because the framework's ansible.cfg makes
# gathering explicit and escalation off. Implicit gathering would run a module over the shell
# os_bootstrap has not yet fixed, and the PowerShell connection plugin refuses become.
#
# =========================================================================================== #
---

#region ------ [ Play: Inventory Contract ] --------------------------------------------------- #
# The inventory already filters to this run's instances by framework-set tags. This guards the
# two states that filter cannot cover: an empty or partial result, and an invocation that never
# said which account and region it is deploying into.

- name: 'PLAY | Validate The Ephemeral AWS Inventory Contract'
  hosts: 'localhost'
  tasks:
    - name: 'INVENTORY | Require The Ratified Five-Instance Shape'
      ansible.builtin.assert:
        that:
          - groups['fileserver_nodes'] | default([]) | length == 4
          - groups['fileserver_witness'] | default([]) | length == 1
          - groups['fileserver_cluster_former'] | default([]) | length == 1
          - groups['fileserver_cluster_former'] | default([]) == ['tcnaw-hafs01a']
          - >-
            groups['fileserver_cluster_former'] | default([])
            | difference(groups['fileserver_nodes'] | default([])) | length == 0
          - >-
            (groups['all'] | default([]) | sort)
            ==
            (
              (groups['fileserver_nodes'] | default([]))
              + (groups['fileserver_witness'] | default([]))
            ) | sort
        fail_msg: >-
          Refusing to configure: expected 4 hosts in 'fileserver_nodes', 1 in
          'fileserver_witness', and only tcnaw-hafs01a in the overlapping
          'fileserver_cluster_former'; found
          {{ groups['fileserver_nodes'] | default([]) | length }} and
          {{ groups['fileserver_witness'] | default([]) | length }}, former hosts
          {{ groups['fileserver_cluster_former'] | default([]) }}, and all hosts
          {{ groups['all'] | default([]) | sort }}. The dynamic EC2 inventory must carry exactly
          the ratified 4 cluster nodes and 1 file-share witness before anything runs.
        quiet: true

    # Account-derived values are passed EXPLICITLY on the invocation, never read from the
    # environment by a role, so the play and the deploy identity cannot disagree.
    - name: 'INVENTORY | Require The AWS Deployment Identity'
      ansible.builtin.assert:
        that:
          - aws_account_id is defined
          - aws_account_id is match('^[0-9]{12}$')
          - aws_region is defined
          - aws_region is match('^[a-z]{2}(-[a-z]+)+-[0-9]$')
        fail_msg: >-
          aws_account_id and aws_region must be provided as extra-vars. The aws-deploy workflow
          passes them from its own environment (the same values the OIDC role ARN and region
          use); a local run must pass both explicitly.
        quiet: true

#endregion --- [ Play: Inventory Contract ] --------------------------------------------------- #

#region ------ [ Play: Configure The Guest ] -------------------------------------------------- #

- name: 'PLAY | Configure The Guest (ephemeral AWS)'
  hosts: 'fileserver_nodes:fileserver_witness'
  any_errors_fatal: true
  vars:
    domain_realm: 'tcn.trinitytechnicalservices.com'
    domain_join_user: "svc-domainjoin@{{ domain_realm }}"
    domain_join_password: "{{ lookup('secret',\n          's3://' ~ aws_account_id ~ \
      '-ansible/host_roles/domain_member/svc-domainjoin-password.txt',\n          \
      '07493ed779c2962bff0b5e19cfa00b8cdb95defcf477f6b5bac36ddef55087ae') }}"
    domain_automation_user: 'tcn\jenkins_runner'
    domain_automation_private_key: "{{ lookup('secret',\n          's3://' ~ aws_account_id ~ \
      '-ansible/host_roles/domain_member/jenkins_runner-ssh-private-key',\n          \
      'be4cb9ba3d7835827b2c3677c8cf1df3aafee8a3698537c040cd6f986049d5b7') }}"
    domain_automation_public_key: "{{ lookup('secret',\n          's3://' ~ aws_account_id ~ \
      '-ansible/host_roles/domain_member/jenkins_runner-ssh-public-key',\n          \
      'ad00b8b65b2d19f31595d4b62eaa79bccd05842d67cbe9b5c3d1ce4095f59281') }}"
    ssh_trusted_principals:
      - user: "{{ domain_automation_user }}"
        public_key: "{{ domain_automation_public_key }}"
    launch_key_file: "{{ lookup('ansible.builtin.env', 'CI_PRIVATE_KEY') \
      | default('~/.ssh/nwarila-ec2-key', true) | expanduser }}"
    credential_sets:
      - name: 'domain-automation'
        connection: 'ssh'
        user: "{{ domain_automation_user }}"
        private_key: "{{ domain_automation_private_key }}"
      - name: 'image-administrator'
        connection: 'ssh'
        user: 'Administrator'
        private_key_file: "{{ launch_key_file }}"
    domain_computer_ou: 'OU=Windows HA FileServer,OU=Domain Servers,DC=tcn,DC=trinitytechnicalservices,DC=com'
    domain_membership:
      realm: "{{ domain_realm }}"
      user: "{{ domain_join_user }}"
      password: "{{ domain_join_password }}"
      computer_ou: "{{ domain_computer_ou }}"
      registration_address: "{{ aws_private_ip_address }}"
      post_restart_credentials: >-
        {{ credential_sets | selectattr('name', 'equalto', 'domain-automation') | list }}

    # The lower-numbered node (01) in each AZ is the sole preparer for that pair's shared volume;
    # its hostname is the key, and the value is that volume's Function tag.
    fileserver_shared_volume_by_preparer:
      tcnaw-hafs01a: 'Cluster Shared Volume (AZ A)'
      tcnaw-hafs01b: 'Cluster Shared Volume (AZ B)'

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    - role: 'credential_resolver'
      tags: ['always']
      vars:
        credential_resolver_candidates: "{{ credential_sets }}"
        credential_resolver_require_elevated: true
        credential_resolver_wait_pause_seconds: 10
        credential_resolver_wait_rounds: 60

    #region ------ [ Roles: Host Readiness ] -------------------------------------------------- #
    # Waits for the connection itself, never a port: a TCP connect cannot speak for a connection
    # reaching its target through a proxy or a tunnel. It then waits out EC2Launch, detecting the
    # platform itself rather than being told.
    - role: 'host_readiness'
    #endregion --- [ Roles: Host Readiness ] -------------------------------------------------- #

    #region ------ [ Roles: OS Bootstrap ] ---------------------------------------------------- #
    # Flips OpenSSH's DefaultShell to PowerShell and proves the session is elevated. Every module
    # after it depends on that. Pass it NO vars: role params outrank the connection scoping it
    # relies on, and a stray one silently re-breaks the pre-flip stage.
    - role: 'os_bootstrap'
    #endregion --- [ Roles: OS Bootstrap ] ---------------------------------------------------- #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

  #region ------ [ Tasks ] -------------------------------------------------------------------- #
  tasks:
    #region ------ [ Tasks: Realm Name Resolution ] ------------------------------------------- #
    # The site gateway carries domain traffic, so nothing else pins the realm's names to the
    # domain controllers. The join resolves the realm's SRV record, so this precedes it.
    - name: 'PROCESS | Pin The Realm At The Domain Controllers'
      when: (state | default('present') | string | lower | trim) != 'absent'
      ansible.windows.win_powershell:
        error_action: 'stop'
        parameters:
          Namespace: ".{{ domain_realm }}"
          NameServers: ['10.69.112.4', '10.69.112.5']
          Comment: 'Managed by windows-fileserver-ha (realm forward zone)'
        script: >-
          {{ lookup('ansible.builtin.file', playbook_dir ~ '/../applications/fileserver/files/Set-DomainControllerNamespace.ps1') }}

    # The realm rule's owner also owns this machine-wide setting: without it Windows will not
    # register through NRPT-supplied servers.
    - name: 'PROCESS | Permit Registration Through The Realm Rule'
      when: (state | default('present') | string | lower | trim) != 'absent'
      ansible.windows.win_regedit:
        data: 0
        delete_key: false
        name: 'DisableNRPTForAdapterRegistration'
        path: 'HKLM:\SYSTEM\CurrentControlSet\Services\Dnscache\Parameters'
        state: 'present'
        type: 'dword'
    #endregion --- [ Tasks: Realm Name Resolution ] ------------------------------------------- #

    #region ------ [ Tasks: Domain Member ] --------------------------------------------------- #
    # Three things are this environment's: the realm and join account, the OU a file server is
    # filed under, and which address the host publishes in DNS. The VPC address, because on the
    # nodes the same interface also carries the cluster and file-server addresses.
    - name: 'PROCESS | Join The Realm'
      when: (state | default('present') | string | lower | trim) != 'absent'
      ansible.builtin.import_role:
        name: 'domain_member'
      vars:
        domain_member: "{{ domain_membership }}"  # noqa: var-naming[no-role-prefix]
    #endregion --- [ Tasks: Domain Member ] --------------------------------------------------- #

    #region ------ [ Tasks: Windows Disk Manager ] -------------------------------------------- #
    # Each Function value names one EBS Multi-Attach volume from terraform/aws.tfvars. The first
    # host in each AZ is its designated preparer. Its partner observes the same attached volume
    # without racing an initialize, partition, or format operation.
    #
    # D: is the contract this play publishes to the cluster work that follows in later regions.
    - name: 'PROCESS | Prepare The Shared Volume'
      when: inventory_hostname in fileserver_shared_volume_by_preparer
      ansible.builtin.import_role:
        name: 'windows_disk_manager'
      vars:
        windows_disk_manager:  # noqa: var-naming[no-role-prefix]
          platform: 'aws'
          disks:
            - function: "{{ fileserver_shared_volume_by_preparer.get(inventory_hostname, '') }}"
              drive_letter: 'D'
              label: 'FILEDATA'
              allocation_unit: 65536
    #endregion --- [ Tasks: Windows Disk Manager ] -------------------------------------------- #

  #endregion --- [ Tasks ] -------------------------------------------------------------------- #

  #region ------ [ Post Tasks ] --------------------------------------------------------------- #
  # New-Cluster's RPC/Kerberos bind to the named domain controller triggers a reverse-PTR lookup
  # of its IP. The realm's forward-only NRPT rule does not cover reverse zones, so that lookup
  # falls through to AmazonProvidedDNS on the ENI, returns an authoritative NXDOMAIN, and
  # formation fails before it ever reaches a live domain controller. Pinning the DC reverse zone
  # to the DCs closes that gap while leaving the ENI's own DNS servers stock.
  post_tasks:
    - name: 'PROCESS | Pin The Domain-Controller Reverse Zone At The Domain Controllers'
      when: (state | default('present') | string | lower | trim) != 'absent'
      ansible.windows.win_powershell:
        error_action: 'stop'
        parameters:
          Namespace: '.112.69.10.in-addr.arpa'
          NameServers: ['10.69.112.4', '10.69.112.5']
          Comment: 'Managed by windows-fileserver-ha (cluster DC reverse zone)'
        script: >-
          {{ lookup('ansible.builtin.file', playbook_dir ~ '/../applications/fileserver/files/Set-DomainControllerNamespace.ps1') }}
  #endregion --- [ Post Tasks ] --------------------------------------------------------------- #

#endregion --- [ Play: Configure The Guest ] -------------------------------------------------- #

#region ------ [ Play: File Server HA Baseline ] ---------------------------------------------- #

- name: 'PLAY | File Server HA Baseline (all five instances, ephemeral AWS)'
  hosts: 'fileserver_nodes:fileserver_witness'
  any_errors_fatal: true
  vars_files:
    - 'vars/fileserver-shares.yml'

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    # Converges the SMB baseline and node-local cluster prerequisites.
    - role: 'fileserver'
      vars:
        fileserver:  # noqa: var-naming[no-role-prefix]
          cluster: &fileserver_cluster_environment
            service_account: 'TCN\svc-fscluster-mgr'
            name: 'TCNAW-FSCL01'
            nodes: ['tcnaw-hafs01a', 'tcnaw-hafs02a', 'tcnaw-hafs01b', 'tcnaw-hafs02b']
            static_addresses: ['10.0.1.11', '10.0.33.11', '10.0.65.11', '10.0.97.11']
            shared_disks:
              - function: 'Cluster Shared Volume (AZ A)'
                owners: ['tcnaw-hafs01a', 'tcnaw-hafs02a']
                fileserver_home: true
              - function: 'Cluster Shared Volume (AZ B)'
                owners: ['tcnaw-hafs01b', 'tcnaw-hafs02b']
                fileserver_home: false
            file_server:
              name: 'TCNAW-HAFS01'
              static_addresses: ['10.0.1.12', '10.0.33.12']
              ignored_network_addresses: ['10.0.64.0', '10.0.96.0']
            witness:
              host: 'tcnaw-witnes01c'
              cluster_principal: 'TCN\TCNAW-FSCL01$'
              node_addresses: ['10.0.1.10', '10.0.33.10', '10.0.65.10', '10.0.97.10']
              share:
                path: 'C:\ClusterWitness'
            access_groups: "{{ fileserver_shares.access_groups }}"
            shares: "{{ fileserver_shares.shares }}"

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: File Server HA Baseline ] ---------------------------------------------- #

#region ------ [ Play: Resolve The Cluster Formation Credential ] ----------------------------- #

- name: 'PLAY | Resolve The Cluster Formation Credential'
  hosts: 'localhost'
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    __fileserver_cluster_secret_url__: >-
      s3://{{ aws_account_id }}-ansible/windows-fileserver-ha/svc-fscluster-mgr_password.secret
  tasks:
    - name: 'INVENTORY | Resolve The Cluster Service Account Password'
      block:
        - name: 'INVENTORY | Read The Cluster Service Account Password'
          no_log: true
          ansible.builtin.set_fact:
            __fileserver_cluster_password__: >-
              {{ lookup('secret', __fileserver_cluster_secret_url__) }}
            cacheable: false
      rescue:
        - name: 'INVENTORY | Report That The Cluster Password Could Not Be Read'
          ansible.builtin.fail:
            msg: >-
              Could not read {{ __fileserver_cluster_secret_url__ }}. Confirm the object exists,
              the controller identity can read that exact object, and boto3 is installed for the
              controller interpreter.

#endregion --- [ Play: Resolve The Cluster Formation Credential ] ----------------------------- #

#region ------ [ Play: Resolve The Cluster Credential On Every Delegate ] --------------------- #

- name: 'PLAY | Resolve The Cluster Credential On Every Delegate'
  hosts: 'fileserver_nodes:fileserver_witness'
  gather_facts: false
  become: false
  any_errors_fatal: true

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    - role: 'credential_resolver'
      tags: ['always']
      vars:
        credential_resolver_candidates:
          - name: 'cluster-service-account'
            connection: 'ssh'
            user: 'TCN\svc-fscluster-mgr'
            password: "{{ hostvars['localhost']['__fileserver_cluster_password__'] }}"
        credential_resolver_require_elevated: true
        credential_resolver_wait_rounds: 0

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: Resolve The Cluster Credential On Every Delegate ] --------------------- #

#region ------ [ Play: Form And Configure The File Server Cluster ] --------------------------- #

- name: 'PLAY | Form And Configure The File Server Cluster'
  hosts: 'fileserver_cluster_former'
  gather_facts: false
  become: false
  vars_files:
    - 'vars/fileserver-shares.yml'

  #region ------ [ Roles ] -------------------------------------------------------------------- #
  roles:

    #region ------ [ Roles: File Server ] ----------------------------------------------------- #
    - role: 'fileserver'
      vars:
        fileserver:  # noqa: var-naming[no-role-prefix]
          execution_scope: 'cluster'
          cluster:
            <<: *fileserver_cluster_environment
            service_account_password: >-
              {{ hostvars['localhost']['__fileserver_cluster_password__'] }}

    #endregion --- [ Roles: File Server ] ----------------------------------------------------- #

  #endregion --- [ Roles ] -------------------------------------------------------------------- #

#endregion --- [ Play: Form And Configure The File Server Cluster ] --------------------------- #

#region ------ [ Play: Forget The Cluster Formation Credential ] ------------------------------ #

- name: 'PLAY | Forget The Cluster Formation Credential'
  hosts: 'localhost'
  gather_facts: false
  become: false
  tasks:
    - name: 'Cleanup | Forget The Cluster Service Account Password'
      no_log: true
      ansible.builtin.set_fact:
        __fileserver_cluster_password__: null
        cacheable: false

#endregion --- [ Play: Forget The Cluster Formation Credential ] ------------------------------ #
