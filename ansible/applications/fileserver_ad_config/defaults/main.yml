# =========================================================================================== #
# File: '{{ role_path }}/defaults/main.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Every input this role takes, with the value it takes when the caller says nothing. The loader
# merges this with the OS overlay in vars/ and then with the caller's own overrides, so a value
# here is the floor rather than a suggestion.
#
# Product policy belongs here. Empty values declare the shape the playbook must fill; validation
# refuses a run whose caller leaves them empty.
#
# =========================================================================================== #
---
fileserver_ad_config_defaults:

  #region ------ [ Defaults: Deployment Lifecycle ] ------------------------------------------- #
  # Active Directory cannot distinguish a stale enabled cluster object from one owned by a live
  # cluster. Existing objects are therefore made adoptable only when the manual caller explicitly
  # declares that no live cluster exists and this run is preparing a fresh deployment.
  fresh_deployment: false
  #endregion --- [ Defaults: Deployment Lifecycle ] ------------------------------------------- #

  #region ------ [ Defaults: Caller-Owned Directory Configuration ] --------------------------- #

  # The account, directory objects, DNS zone, and node records all name one deployment. Their
  # empty shapes stay visible here while the manual playbook publishes the environment values.
  service_account:
    name: ''
    path: ''
  cluster:
    name: ''
    path: ''
  file_server:
    name: ''
    path: ''
  dns_zone: ''
  nodes: {}
  #endregion --- [ Defaults: Caller-Owned Directory Configuration ] --------------------------- #
