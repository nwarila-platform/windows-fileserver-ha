# =========================================================================================== #
# File: '{{ role_path }}/tasks/validate.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Validates the load-bearing fileserver configuration after the v3 loader merge, on the
# CONTROLLER, before anything touches the guest.
#
# Shape only, deliberately: the settings VOCABULARY (whether each key names a real SMB server
# property) is enforced by Set-SmbServerHardening.ps1 itself, which fails before any mutation
# on an unknown name against the live property surface — a controller-side word list would
# just be a stale copy of that surface.
#
# =========================================================================================== #
---
- name: 'VALIDATE | Require A Supported Execution Scope'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - fileserver_running.execution_scope in ['node', 'cluster']
    fail_msg: >-
      Refusing to run: fileserver.execution_scope must be either 'node' or 'cluster'.
    quiet: true

- name: 'VALIDATE | Require A Non-Empty SMB Baseline Of Well-Formed Property Names'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - fileserver_running.smb.settings is mapping
      - fileserver_running.smb.settings | length > 0
      - >-
        fileserver_running.smb.settings.keys()
        | reject('match', '^[A-Za-z][A-Za-z0-9]*$') | list | length == 0
    fail_msg: >-
      Refusing to run: fileserver.smb.settings must be a non-empty map of SMB server
      configuration property names (letters and digits, starting with a letter) to desired
      values. An empty or malformed baseline converges nothing and usually means an override
      replaced the whole 'fileserver:' dict without restating it.
    quiet: true

- name: 'VALIDATE | Require Well-Formed Cluster And File Server Names'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - fileserver_running.cluster.service_account is string
      - fileserver_running.cluster.service_account is match('^[A-Za-z0-9][A-Za-z0-9._\\\\-]*$')
      - fileserver_running.cluster.name is string
      - fileserver_running.cluster.name is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
      - fileserver_running.cluster.name_resource is string
      - fileserver_running.cluster.name_resource is match('^[A-Za-z0-9][A-Za-z0-9 ._-]*$')
      - fileserver_running.cluster.file_server.name is string
      - fileserver_running.cluster.file_server.name is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
    fail_msg: >-
      Refusing to run: fileserver.cluster.service_account, name, name_resource, and
      file_server.name must be non-empty strings containing only their supported naming
      characters.
    quiet: true

- name: 'VALIDATE | Require The Ratified Shared Disk Ownership Topology'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - fileserver_running.cluster.nodes is sequence
      - fileserver_running.cluster.nodes is not string
      - fileserver_running.cluster.nodes | length == 4
      - fileserver_running.cluster.nodes | unique | length == 4
      - fileserver_running.cluster.nodes | reject('string') | list | length == 0
      - fileserver_running.cluster.shared_disks | length == 2
      - fileserver_running.cluster.shared_disks | map(attribute='function') | unique | length == 2
      - >-
        fileserver_running.cluster.shared_disks
        | selectattr('fileserver_home', 'equalto', true) | list | length == 1
      - >-
        fileserver_running.cluster.shared_disks[0].owners
        | intersect(fileserver_running.cluster.shared_disks[1].owners) | length == 0
      - >-
        fileserver_running.cluster.shared_disks
        | map(attribute='owners') | map('length') | list == [2, 2]
      - >-
        fileserver_running.cluster.shared_disks[0].owners | unique | length == 2
      - >-
        fileserver_running.cluster.shared_disks[1].owners | unique | length == 2
      - >-
        fileserver_running.cluster.shared_disks[0].owners
        | difference(fileserver_running.cluster.nodes) | length == 0
      - >-
        fileserver_running.cluster.shared_disks[1].owners
        | difference(fileserver_running.cluster.nodes) | length == 0
    fail_msg: >-
      Refusing to run: fileserver.cluster.nodes and shared_disks must declare four unique
      string nodes, two disjoint two-node owner sets, unique functions, and exactly one
      fileserver_home disk.
    quiet: true

- name: 'VALIDATE | Require Disjoint IPv4 Address Declarations'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __fileserver_ipv4_pattern__: '^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})$'
    __fileserver_all_addresses__: >-
      {{ fileserver_running.cluster.static_addresses
         + fileserver_running.cluster.file_server.static_addresses
         + fileserver_running.cluster.file_server.ignored_network_addresses }}
  ansible.builtin.assert:
    that:
      - fileserver_running.cluster.static_addresses | length == 4
      - fileserver_running.cluster.static_addresses | unique | length == 4
      - fileserver_running.cluster.file_server.static_addresses | length == 2
      - fileserver_running.cluster.file_server.static_addresses | unique | length == 2
      - fileserver_running.cluster.file_server.ignored_network_addresses | length == 2
      - fileserver_running.cluster.file_server.ignored_network_addresses | unique | length == 2
      - __fileserver_all_addresses__ | reject('match', __fileserver_ipv4_pattern__) | list | length == 0
      - __fileserver_all_addresses__ | unique | length == 8
    fail_msg: >-
      Refusing to run: fileserver.cluster static_addresses, file_server.static_addresses,
      and file_server.ignored_network_addresses must be unique IPv4 strings with lengths
      four, two, and two and must be pairwise disjoint.
    quiet: true

- name: 'VALIDATE | Require Runtime-Only Shared Disk Identity'
  when: (state | default('present') | string | lower | trim) == 'present'
  loop: "{{ fileserver_running.cluster.shared_disks }}"
  loop_control:
    label: "{{ disk.function | default('malformed shared disk') }}"
    loop_var: 'disk'
  ansible.builtin.assert:
    that:
      - disk is mapping
      - disk.keys() | list | sort == ['fileserver_home', 'function', 'owners']
      - disk.function is string
      - disk.function | length > 0
      - disk.fileserver_home is boolean
    fail_msg: >-
      Refusing to run: each fileserver.cluster.shared_disks item must contain exactly
      function, owners, and fileserver_home; runtime volume IDs and observed disk or resource
      identity do not belong in defaults.
    quiet: true
- name: 'VALIDATE | Require The Ratified Cluster Name Parameters'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - fileserver_running.cluster.name_parameters.register_all_providers_ip is integer
      - fileserver_running.cluster.name_parameters.register_all_providers_ip == 0
      - fileserver_running.cluster.name_parameters.host_record_ttl is integer
      - fileserver_running.cluster.name_parameters.host_record_ttl == 300
    fail_msg: >-
      Refusing to run: fileserver.cluster.name_parameters.register_all_providers_ip must be
      integer 0 and host_record_ttl must be integer 300.
    quiet: true

- name: 'VALIDATE | Require The File Share Witness Contract'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __fileserver_witness_ipv4_pattern__: '^(?:(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})\.){3}(?:25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})$'
  ansible.builtin.assert:
    that:
      - fileserver_running.cluster.witness.host is string
      - >-
        fileserver_running.cluster.witness.host
        is match('^[A-Za-z0-9](?:[A-Za-z0-9-]{0,13}[A-Za-z0-9])?$')
      - >-
        (fileserver_running.cluster.witness.host | lower)
        not in (fileserver_running.cluster.nodes | map('lower') | list)
      - fileserver_running.cluster.witness.cluster_principal is string
      - >-
        fileserver_running.cluster.witness.cluster_principal
        is match('^[^\\\\]+\\\\[^\\\\]+\\$$')
      - >-
        (fileserver_running.cluster.witness.cluster_principal | lower).split('\\')[-1]
        == (fileserver_running.cluster.name | lower) ~ '$'
      - fileserver_running.cluster.witness.node_addresses is sequence
      - fileserver_running.cluster.witness.node_addresses is not string
      - fileserver_running.cluster.witness.node_addresses | length == 4
      - fileserver_running.cluster.witness.node_addresses | unique | length == 4
      - >-
        fileserver_running.cluster.witness.node_addresses
        | reject('match', __fileserver_witness_ipv4_pattern__) | list | length == 0
      - fileserver_running.cluster.witness.share.name == 'witness$'
      - fileserver_running.cluster.witness.share.path is match('^[A-Z]:\\\\[^\\\\].*$')
      - fileserver_running.cluster.witness.share.description is string
      - fileserver_running.cluster.witness.share.description | length > 0
      - fileserver_running.cluster.witness.share.caching_mode == 'None'
      - fileserver_running.cluster.witness.share.encrypt_data is boolean
      - >-
        fileserver_running.cluster.witness.share.encrypt_data
        == fileserver_running.smb.settings.EncryptData
    fail_msg: >-
      Refusing to run: fileserver.cluster.witness must declare a non-node host, the cluster
      name object's down-level principal, four unique node IPv4 addresses, and the ratified
      hidden, drive-rooted, encrypted, no-cache witness share.
    quiet: true

- name: 'VALIDATE | Require The Protected Share And Folder Policy'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __fileserver_required_share_defaults__:
      continuously_available: true
      folder_enumeration_mode: 'AccessBased'
      caching_mode: 'None'
      encrypt_data: true
    __fileserver_required_ntfs_access__:
      - principal: 'NT AUTHORITY\SYSTEM'
        access_control_type: 'Allow'
        rights: 'FullControl'
        inheritance_flags: 'ContainerInherit,ObjectInherit'
        propagation_flags: 'None'
      - principal: 'BUILTIN\Administrators'
        access_control_type: 'Allow'
        rights: 'FullControl'
        inheritance_flags: 'ContainerInherit,ObjectInherit'
        propagation_flags: 'None'
    __fileserver_required_folder_access__:
      - principal: 'NT AUTHORITY\SYSTEM'
        access_control_type: 'Allow'
        rights: 'FullControl'
      - principal: 'BUILTIN\Administrators'
        access_control_type: 'Allow'
        rights: 'FullControl'
    __fileserver_required_share_access__:
      - principal: 'BUILTIN\Administrators'
        access_control_type: 'Allow'
        access_right: 'Full'
  ansible.builtin.assert:
    that:
      - fileserver_running.cluster.share_defaults == __fileserver_required_share_defaults__
      - fileserver_running.cluster.protected_ntfs_access == __fileserver_required_ntfs_access__
      - >-
        fileserver_running.cluster.protected_folder_access
        == __fileserver_required_folder_access__
      - fileserver_running.cluster.protected_share_access == __fileserver_required_share_access__
    fail_msg: >-
      Refusing to run: fileserver.cluster share defaults and protected access entries must retain
      the ratified continuously available, access-based, no-cache, encrypted policy and exact
      SYSTEM and Administrators grants.
    quiet: true

- name: 'VALIDATE | Require A Non-Empty Clustered Share List'
  when: (state | default('present') | string | lower | trim) == 'present'
  ansible.builtin.assert:
    that:
      - fileserver_running.cluster.shares is sequence
      - fileserver_running.cluster.shares is not string
      - fileserver_running.cluster.shares | length > 0
      - fileserver_running.cluster.shares[0].name == 'data'
    fail_msg: >-
      Refusing to run: fileserver.cluster.shares must be a non-empty list whose first declaration
      is the data share.
    quiet: true

- name: 'VALIDATE | Require Well-Formed Clustered Share Declarations'
  when: (state | default('present') | string | lower | trim) == 'present'
  loop: "{{ fileserver_running.cluster.shares }}"
  loop_control:
    label: "{{ share.name | default('malformed share') }}"
    loop_var: 'share'
  vars:
    __fileserver_share_keys__:
      - 'access'
      - 'caching_mode'
      - 'continuously_available'
      - 'description'
      - 'encrypt_data'
      - 'folder_enumeration_mode'
      - 'folders'
      - 'name'
      - 'path'
    __fileserver_required_share_keys__: >-
      {{ ['access', 'description', 'name', 'path'] }}
  ansible.builtin.assert:
    that:
      - share is mapping
      - share.keys() | difference(__fileserver_share_keys__) | length == 0
      - __fileserver_required_share_keys__ | difference(share.keys()) | length == 0
      - share.name is string
      - share.name is match('^[^\\\\/:*?"<>|]+$')
      - share.path is string
      - share.path is match('^[A-Z]:\\\\[^\\\\]+(?:\\\\[^\\\\]+)*$')
      - share.description is string
      - share.description | length > 0
      - >-
        (share.continuously_available
         | default(fileserver_running.cluster.share_defaults.continuously_available)) is boolean
      - >-
        (share.folder_enumeration_mode
         | default(fileserver_running.cluster.share_defaults.folder_enumeration_mode))
        in ['AccessBased', 'Unrestricted']
      - >-
        (share.caching_mode | default(fileserver_running.cluster.share_defaults.caching_mode))
        in ['None', 'Manual', 'Documents', 'Programs', 'BranchCache']
      - >-
        (share.encrypt_data | default(fileserver_running.cluster.share_defaults.encrypt_data))
        is boolean
      - share.access is sequence
      - share.access is not string
      - share.access is not mapping
      - share.folders | default([]) is sequence
      - share.folders | default([]) is not string
      - share.folders | default([]) is not mapping
    fail_msg: >-
      Refusing to run: each fileserver.cluster.shares item must contain a safe non-empty name,
      drive-rooted normalized path, description, a compact root access list, supported optional
      share-property overrides, and only an optional folders list in addition to the required keys.
    quiet: true

- name: 'VALIDATE | Require Unique Non-Nested Clustered Shares'
  when: (state | default('present') | string | lower | trim) == 'present'
  loop: "{{ fileserver_running.cluster.shares }}"
  loop_control:
    label: "{{ share.name }}"
    loop_var: 'share'
  vars:
    __fileserver_share_names__: >-
      {{ fileserver_running.cluster.shares | map(attribute='name') | map('lower') | list }}
    __fileserver_share_paths__: >-
      {{ fileserver_running.cluster.shares | map(attribute='path') | map('lower') | list }}
    __fileserver_share_path__: "{{ share.path | lower }}"
    __fileserver_nested_share_paths__: >-
      {{ __fileserver_share_paths__ | reject('equalto', __fileserver_share_path__)
         | select('match', '^' ~ (__fileserver_share_path__ | regex_escape) ~ '\\\\') | list }}
  ansible.builtin.assert:
    that:
      - __fileserver_share_names__ | unique | length == __fileserver_share_names__ | length
      - __fileserver_share_paths__ | unique | length == __fileserver_share_paths__ | length
      - __fileserver_nested_share_paths__ | length == 0
    fail_msg: >-
      Refusing to run: fileserver.cluster.shares names and paths must be unique without regard to
      case, and no declared share path may contain another declared share path.
    quiet: true

- name: 'VALIDATE | Require Well-Formed Compact Clustered Share Access Entries'
  when: (state | default('present') | string | lower | trim) == 'present'
  loop: >-
    {{ fileserver_running.cluster.shares | map(attribute='access') | flatten }}
  loop_control:
    label: "{{ access_entry.principal | default('malformed compact access entry') }}"
    loop_var: 'access_entry'
  vars:
    __fileserver_protected_principals__: ['nt authority\system', 'builtin\administrators']
  ansible.builtin.assert:
    that:
      - access_entry is mapping
      - >-
        access_entry.keys() | list | sort == ['principal', 'rights', 'share']
      - access_entry.principal is string
      - access_entry.principal | length > 0
      - access_entry.principal | lower not in __fileserver_protected_principals__
      - access_entry.rights in ['FullControl', 'Modify', 'ReadAndExecute']
      - access_entry.share in ['Full', 'Change', 'Read']
    fail_msg: >-
      Refusing to run: every compact share access entry must contain exactly principal, rights,
      and share, name a non-protected principal, and use supported NTFS and SMB rights. SYSTEM,
      Administrators, access_control_type, inheritance_flags, and propagation_flags are role-owned.
    quiet: true

- name: 'VALIDATE | Require Safe Clustered Share Root Access'
  when: (state | default('present') | string | lower | trim) == 'present'
  loop: "{{ fileserver_running.cluster.shares }}"
  loop_control:
    label: "{{ share.name }}"
    loop_var: 'share'
  vars:
    __fileserver_access_principals__: >-
      {{ share.access | map(attribute='principal') | map('lower') | list }}
  ansible.builtin.assert:
    that:
      - >-
        __fileserver_access_principals__ | unique | length
        == __fileserver_access_principals__ | length
    fail_msg: >-
      Refusing to run: every compact clustered share root must use unique caller principals.
    quiet: true

- name: 'VALIDATE | Require The Exact Clustered Data Share Access Policy'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    share: "{{ fileserver_running.cluster.shares[0] }}"
  ansible.builtin.assert:
    that:
      - >-
        (share.continuously_available
         | default(fileserver_running.cluster.share_defaults.continuously_available)) is sameas true
      - >-
        (share.folder_enumeration_mode
         | default(fileserver_running.cluster.share_defaults.folder_enumeration_mode))
        == 'AccessBased'
      - >-
        (share.caching_mode | default(fileserver_running.cluster.share_defaults.caching_mode))
        == 'None'
      - >-
        (share.encrypt_data | default(fileserver_running.cluster.share_defaults.encrypt_data))
        is sameas true
      - >-
        (share.encrypt_data | default(fileserver_running.cluster.share_defaults.encrypt_data))
        == fileserver_running.smb.settings.EncryptData
      - share.access | length == 1
      - share.access[0].rights == 'Modify'
      - share.access[0].share == 'Change'
    fail_msg: >-
      Refusing to run: fileserver.cluster.shares[0] must preserve the data share's exact
      share properties and one caller principal granted NTFS Modify and SMB Change. The role adds
      the protected entries and fixed access-rule fields during translation.
    quiet: true

- name: 'VALIDATE | Require Safe Ordered Clustered Folder Declarations'
  when: (state | default('present') | string | lower | trim) == 'present'
  loop: >-
    {{ fileserver_running.cluster.shares | subelements('folders', skip_missing=True) }}
  loop_control:
    extended: true
    label: "{{ declared_folder.0.name }}\\{{ declared_folder.1.path }}"
    loop_var: 'declared_folder'
  vars:
    __fileserver_folder_paths__: >-
      {{ declared_folder.0.folders | map(attribute='path') | map('lower') | list }}
    __fileserver_folder_path__: "{{ declared_folder.1.path | lower }}"
    __fileserver_folder_parent__: >-
      {{ __fileserver_folder_path__.rsplit('\\', 1)[0]
         if '\\' in __fileserver_folder_path__ else '' }}
    __fileserver_prior_folder_paths__: >-
      {{ ansible_loop.allitems[:ansible_loop.index0]
         | selectattr('0', 'equalto', declared_folder.0)
         | map(attribute='1.path') | map('lower') | list }}
    __fileserver_folder_principals__: >-
      {{ declared_folder.1.access | map(attribute='principal') | map('lower') | list }}
    __fileserver_folder_keys__: ['access', 'inherit', 'path']
  ansible.builtin.assert:
    that:
      - declared_folder.1 is mapping
      - declared_folder.1.keys() | difference(__fileserver_folder_keys__) | length == 0
      - >-
        ['access', 'path'] | difference(declared_folder.1.keys()) | length == 0
      - declared_folder.1.path is string
      - declared_folder.1.path is match('^[^\\\\]+(?:\\\\[^\\\\]+)*$')
      - declared_folder.1.path is not search('[:/*?"<>|]')
      - declared_folder.1.path is not search('(^|\\\\)\.\.?($|\\\\)')
      - (declared_folder.1.inherit | default(true)) is boolean
      - declared_folder.1.access is sequence
      - declared_folder.1.access is not string
      - >-
        __fileserver_folder_paths__ | unique | length
        == __fileserver_folder_paths__ | length
      - >-
        __fileserver_folder_parent__ == ''
        or __fileserver_folder_parent__ in __fileserver_prior_folder_paths__
      - >-
        __fileserver_folder_principals__ | unique | length
        == __fileserver_folder_principals__ | length
    fail_msg: >-
      Refusing to run: each clustered-share folder must have a unique normalized relative path,
      declare its parent earlier, optionally select inheritance with a boolean, and use unique
      caller principals. The role adds protected entries during translation.
    quiet: true

- name: 'VALIDATE | Require Well-Formed Clustered Folder Access Entries'
  when: (state | default('present') | string | lower | trim) == 'present'
  loop: >-
    {{ fileserver_running.cluster.shares | map(attribute='folders', default=[])
       | flatten | map(attribute='access') | flatten }}
  loop_control:
    label: "{{ folder_entry.principal | default('malformed folder access entry') }}"
    loop_var: 'folder_entry'
  vars:
    __fileserver_protected_principals__: ['nt authority\system', 'builtin\administrators']
  ansible.builtin.assert:
    that:
      - folder_entry is mapping
      - >-
        folder_entry.keys() | list | sort == ['principal', 'rights']
      - folder_entry.principal is string
      - folder_entry.principal | length > 0
      - folder_entry.principal | lower not in __fileserver_protected_principals__
      - folder_entry.rights in ['FullControl', 'Modify', 'ReadAndExecute']
    fail_msg: >-
      Refusing to run: every compact folder access entry must contain exactly principal and
      rights, name a non-protected principal, and use a supported NTFS right. SYSTEM,
      Administrators, access_control_type, inheritance_flags, and propagation_flags are role-owned.
    quiet: true

- name: 'VALIDATE | Require The Access Group Declaration Shape'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __fileserver_access_group_keys__: ['groups', 'path', 'unmanaged_principals']
  ansible.builtin.assert:
    that:
      - fileserver_running.cluster.access_groups is mapping
      - >-
        fileserver_running.cluster.access_groups.keys() | list | sort
        == __fileserver_access_group_keys__
      - fileserver_running.cluster.access_groups.path is string
      - fileserver_running.cluster.access_groups.unmanaged_principals is sequence
      - fileserver_running.cluster.access_groups.unmanaged_principals is not string
      - fileserver_running.cluster.access_groups.unmanaged_principals is not mapping
      - fileserver_running.cluster.access_groups.groups is sequence
      - fileserver_running.cluster.access_groups.groups is not string
      - fileserver_running.cluster.access_groups.groups is not mapping
    fail_msg: >-
      Refusing to run: fileserver.cluster.access_groups must contain exactly path,
      unmanaged_principals, and groups in the compact shared declaration.
    quiet: true

- name: 'VALIDATE | Require Well-Formed Compact Access Groups'
  when: (state | default('present') | string | lower | trim) == 'present'
  loop: "{{ fileserver_running.cluster.access_groups.groups }}"
  loop_control:
    label: "{{ group.principal | default('malformed access group') }}"
    loop_var: 'group'
  ansible.builtin.assert:
    that:
      - group is mapping
      - group.keys() | list | sort == ['description', 'principal']
      - group.principal is string
      - >-
        group.principal is match(
          '^[A-Za-z0-9](?:[A-Za-z0-9-]{0,13}[A-Za-z0-9])?\\\\'
          ~ '[A-Za-z0-9](?:[A-Za-z0-9-]{0,13}[A-Za-z0-9])?_GS-FileShare_'
          ~ '[A-Z][A-Za-z0-9]*(?:-[A-Z][A-Za-z0-9]*)*-(?:Modify|Read)$'
        )
      - group.description is string
      - group.description | trim | length > 0
    fail_msg: >-
      Refusing to run: every managed access group must contain exactly a non-empty description
      and a DOMAIN\DOMAIN_GS-FileShare_Share[-Folder...]-Modify or -Read principal.
    quiet: true

- name: 'VALIDATE | Require Exact File-Side Principal Coverage'
  when: (state | default('present') | string | lower | trim) == 'present'
  vars:
    __fileserver_declared_principals__: >-
      {{
        ((fileserver_running.cluster.shares
          | map(attribute='access') | flatten
          | map(attribute='principal') | list)
         + (fileserver_running.cluster.shares
            | map(attribute='folders', default=[]) | flatten
            | map(attribute='access') | flatten
            | map(attribute='principal') | list))
        | map('lower') | unique | list
      }}
    __fileserver_unmanaged_principals__: >-
      {{ fileserver_running.cluster.access_groups.unmanaged_principals
         | map('lower') | unique | list }}
    __fileserver_managed_principals__: >-
      {{ fileserver_running.cluster.access_groups.groups
         | map(attribute='principal') | map('lower') | unique | list }}
  ansible.builtin.assert:
    that:
      - >-
        __fileserver_unmanaged_principals__ | unique | length
        == fileserver_running.cluster.access_groups.unmanaged_principals | length
      - >-
        __fileserver_managed_principals__ | unique | length
        == fileserver_running.cluster.access_groups.groups | length
      - >-
        __fileserver_managed_principals__
        | difference(__fileserver_declared_principals__) | length == 0
      - >-
        __fileserver_declared_principals__
        | difference(__fileserver_managed_principals__
                     + __fileserver_unmanaged_principals__) | length == 0
    fail_msg: >-
      Refusing to run: every managed access group principal must occur in the file-side share
      declaration, and every file-side principal must be either managed or explicitly unmanaged.
    quiet: true

- name: 'VALIDATE | Require Managed Root Groups To Follow The Share Naming Convention'
  when: (state | default('present') | string | lower | trim) == 'present'
  loop: "{{ fileserver_running.cluster.shares | subelements('access') }}"
  loop_control:
    label: "{{ root_grant.1.principal }}"
    loop_var: 'root_grant'
  vars:
    __fileserver_managed_principals__: >-
      {{ fileserver_running.cluster.access_groups.groups
         | map(attribute='principal') | map('lower') | list }}
    __fileserver_group_domain__: >-
      {{ root_grant.1.principal | regex_replace('\\.*$', '') }}
    __fileserver_group_separator__: >-
      {{ root_grant.1.principal[__fileserver_group_domain__ | length] }}
    __fileserver_group_suffix__: >-
      {{ 'Read' if root_grant.1.rights == 'ReadAndExecute' else 'Modify' }}
    __fileserver_expected_principal__: >-
      {{ __fileserver_group_domain__ ~ __fileserver_group_separator__
         ~ __fileserver_group_domain__
         ~ '_GS-FileShare_' ~ root_grant.0.name
         ~ '-' ~ __fileserver_group_suffix__ }}
    __fileserver_expected_share_right__: >-
      {{ 'Read' if root_grant.1.rights == 'ReadAndExecute' else 'Change' }}
  ansible.builtin.assert:
    that:
      - >-
        root_grant.1.principal | lower not in __fileserver_managed_principals__
        or root_grant.1.principal | lower == __fileserver_expected_principal__ | lower
      - >-
        root_grant.1.principal | lower not in __fileserver_managed_principals__
        or root_grant.1.rights in ['ReadAndExecute', 'Modify']
      - >-
        root_grant.1.principal | lower not in __fileserver_managed_principals__
        or root_grant.1.share == __fileserver_expected_share_right__
    fail_msg: >-
      Refusing to run: managed root groups must be named
      DOMAIN\DOMAIN_GS-FileShare_Share-Read or -Modify; Read requires ReadAndExecute and Read,
      while Modify requires Modify and Change. Expected {{ __fileserver_expected_principal__ }}
      for {{ root_grant.1.principal }}.
    quiet: true

- name: 'VALIDATE | Require Managed Folder Groups To Follow The Folder Naming Convention'
  when: (state | default('present') | string | lower | trim) == 'present'
  loop: >-
    {%- set grants = namespace(items=[]) -%}
    {%- for share in fileserver_running.cluster.shares -%}
    {%- for folder in share.folders | default([]) -%}
    {%- for grant in folder.access -%}
    {%- set grants.items = grants.items + [{
      'share': share.name,
      'folder': folder.path,
      'principal': grant.principal,
      'rights': grant.rights
    }] -%}
    {%- endfor -%}
    {%- endfor -%}
    {%- endfor -%}
    {{ grants.items }}
  loop_control:
    label: "{{ folder_grant.principal }}"
    loop_var: 'folder_grant'
  vars:
    __fileserver_managed_principals__: >-
      {{ fileserver_running.cluster.access_groups.groups
         | map(attribute='principal') | map('lower') | list }}
    __fileserver_group_domain__: >-
      {{ folder_grant.principal | regex_replace('\\.*$', '') }}
    __fileserver_group_separator__: >-
      {{ folder_grant.principal[__fileserver_group_domain__ | length] }}
    __fileserver_group_suffix__: >-
      {{ 'Read' if folder_grant.rights == 'ReadAndExecute' else 'Modify' }}
    __fileserver_expected_principal__: >-
      {{ __fileserver_group_domain__ ~ __fileserver_group_separator__
         ~ __fileserver_group_domain__
         ~ '_GS-FileShare_' ~ folder_grant.share ~ '-'
         ~ (folder_grant.folder | regex_replace('\\', '-')) ~ '-'
         ~ __fileserver_group_suffix__ }}
  ansible.builtin.assert:
    that:
      - >-
        folder_grant.principal | lower not in __fileserver_managed_principals__
        or folder_grant.principal | lower == __fileserver_expected_principal__ | lower
      - >-
        folder_grant.principal | lower not in __fileserver_managed_principals__
        or folder_grant.rights in ['ReadAndExecute', 'Modify']
    fail_msg: >-
      Refusing to run: managed folder groups must be named
      DOMAIN\DOMAIN_GS-FileShare_Share-Folder[-Folder...]-Read or -Modify; Read requires
      ReadAndExecute and Modify requires Modify. Expected {{ __fileserver_expected_principal__ }} for
      {{ folder_grant.principal }}.
    quiet: true
