# Role metadata for fileserver. Description-only (style guide §8): NOT an enforcing argument
# spec. The role's tasks/validate.yml enforces its merged-config guards.
# The playbook selects the role's node or cluster execution scope; tasks/validate.yml enforces it.
#
# Defaults describe only the ratified SMB, clustered-share, and witness-share product policy. The
# playbook supplies the caller-declared topology, disk ownership, file-server, witness, network,
# path, and site-principal identity. The role resolves runtime volume identities; sensitive
# connection data stays caller-owned. Storage Replica and a second file-server role are outside
# the implemented surface; tasks/validate.yml owns enforcement.
# =========================================================================================== #
---
galaxy_info:
  role_name: 'fileserver'
  namespace: 'nwarila_platform'
  author: 'nwarila-platform'
  description: >-
    Windows Server 2025 file service: SMB and node prerequisites, a caller-declared WSFC cluster,
    two adopted owner-scoped shared disks, one caller-declared clustered file-server role, and its
    exact encrypted continuously available data share. A dedicated caller-declared domain member
    publishes the file-share witness for Node and File Share Majority quorum. Storage Replica and
    a second file-server role are excluded.
  license: 'MIT'
  min_ansible_version: '2.17'
  platforms:
    - name: 'Windows'
      versions:
        - '2025'
  galaxy_tags: ['windows', 'fileserver', 'cluster']

dependencies: []
