# =========================================================================================== #
# File: '{{ role_path }}/defaults/main.yml'
# --- [ Description ] ----------------------------------------------------------------------- #
#
# Lowest-precedence configuration for the fileserver role. The v3 loader merges the OS overlay
# in vars/ over this map and publishes the result as 'fileserver_running'; tasks read only the
# merged map, never these keys directly.
#
# This single-fleet role defaults the ratified topology and security policy. Secrets and runtime
# AWS identifiers never belong in defaults; the playbook resolves them only at their use boundary.
#
# =========================================================================================== #
---
fileserver_defaults:

  #region ------ [ SMB server baseline ] ----------------------------------------------------- #

  smb:
    # Property-name -> desired-value pairs consumed verbatim by Set-SmbServerHardening.ps1.
    # Every key must be a Get/Set-SmbServerConfiguration property; the script fails BEFORE any
    # mutation on an unknown name, so validate.yml only enforces the map's shape, not its
    # vocabulary.
    settings:
      # SMB1 is remove-not-disable territory, but the protocol switch is the part the SMB
      # server owns; the feature removal is a separate concern with its own reboot semantics.
      EnableSMB1Protocol: false
      # Signing and encryption are cheap on SMB3 with modern clients, and every intended
      # consumer of this cluster is SMB3-capable (PRD: Windows Server 2025 nodes).
      RequireSecuritySignature: true
      EncryptData: true
      RejectUnencryptedAccess: true
      # Audit any straggler attempting SMB1 so the override decision, if ever needed, is made
      # on evidence rather than on a helpdesk anecdote.
      AuditSmb1Access: true

  #endregion --- [ SMB server baseline ] ----------------------------------------------------- #
  #region ------ [ Cluster ] ----------------------------------------------------------------- #
  cluster:
    service_account: 'TCN\svc-fscluster-mgr'
    name: 'TCNAW-FSCL01'
    nodes:
      - 'tcnaw-hafs01a'
      - 'tcnaw-hafs02a'
      - 'tcnaw-hafs01b'
      - 'tcnaw-hafs02b'
    static_addresses:
      - '10.0.1.11'
      - '10.0.33.11'
      - '10.0.65.11'
      - '10.0.97.11'
    name_resource: 'Cluster Name'
    name_parameters:
      register_all_providers_ip: 0
      host_record_ttl: 300
    shared_disks:
      - function: 'Cluster Shared Volume (AZ A)'
        owners: ['tcnaw-hafs01a', 'tcnaw-hafs02a']
        fileserver_home: true
      - function: 'Cluster Shared Volume (AZ B)'
        owners: ['tcnaw-hafs01b', 'tcnaw-hafs02b']
        fileserver_home: false
    file_server:
      name: 'TCNAW-HAFS01'
      static_addresses: ['10.0.1.12', '10.0.33.12']
      ignored_network_addresses: ['10.0.64.0', '10.0.96.0']
    share:
      name: 'data'
      path: 'D:\shares\data'
      description: 'Highly available file data'
      continuously_available: true
      folder_enumeration_mode: 'AccessBased'
      caching_mode: 'None'
      encrypt_data: true
      ntfs_access:
        - principal: 'NT AUTHORITY\SYSTEM'
          access_control_type: 'Allow'
          rights: 'FullControl'
          inheritance_flags: 'ContainerInherit,ObjectInherit'
          propagation_flags: 'None'
        - principal: 'BUILTIN\Administrators'
          access_control_type: 'Allow'
          rights: 'FullControl'
          inheritance_flags: 'ContainerInherit,ObjectInherit'
          propagation_flags: 'None'
        - principal: 'TCN\Domain Users'
          access_control_type: 'Allow'
          rights: 'Modify'
          inheritance_flags: 'ContainerInherit,ObjectInherit'
          propagation_flags: 'None'
      share_access:
        - principal: 'BUILTIN\Administrators'
          access_control_type: 'Allow'
          access_right: 'Full'
        - principal: 'TCN\Domain Users'
          access_control_type: 'Allow'
          access_right: 'Change'
  #endregion --- [ Cluster ] ----------------------------------------------------------------- #
